<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obsidian · Superpower Inside 검수</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/preview.css" />
    <script src="/bundle.js" defer></script>
  </head>
  <body class="mod-macos theme-light">
    <div id="preview-toolbar" role="region" aria-label="검수 환경"></div>
    <div class="app-container">
      <div class="horizontal-main-container">
        <div class="workspace">
          <div class="workspace-split mod-vertical mod-root">
            <div class="workspace-tabs mod-top">
              <div class="workspace-tab-header-container">
                <div class="workspace-tab-header is-active">
                  <div class="workspace-tab-header-inner">
                    <div class="workspace-tab-header-inner-title">Superpower Inside</div>
                  </div>
                </div>
              </div>
              <div class="workspace-tab-container">
                <div class="workspace-leaf mod-active">
                  <div
                    class="workspace-leaf-content"
                    data-type="superpower-inside-chat"
                    id="preview-leaf"
                  ></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="notice-container"></div>
    <div id="preview-result" role="status"></div>
  </body>
</html>
