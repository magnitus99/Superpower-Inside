[package]
name = "superpower-rag-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust WebAssembly core for Superpower Inside RAG indexing and retrieval."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1.0.150", features = ["preserve_order"] }
regex = "1.11.1"
wasm-bindgen = "=0.2.123"
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2"] }
# zip은 flate2 백엔드를 직접 고르지 않으므로 순수 Rust miniz_oxide 백엔드를 명시합니다.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
quick-xml = "0.42.0"
unicode-normalization = { version = "0.1.26", default-features = false }

[lints]
workspace = true
