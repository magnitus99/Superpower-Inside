name: Release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: write
  attestations: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify dev-to-main release
        run: |
          git fetch --no-tags origin main dev
          node scripts/check-branch-policy.mjs --release-tag "$GITHUB_REF_NAME"

      - name: Stage source release assets
        run: |
          mkdir -p .local/plugin
          cp manifest.json styles.css THIRD_PARTY_NOTICES.md .local/plugin/

      - name: Verify committed release assets
        run: node scripts/validate-obsidian-review.mjs --tag "$GITHUB_REF_NAME" --built

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            .local/plugin/manifest.json
            .local/plugin/main.js
            .local/plugin/styles.css
            .local/plugin/tern_engine_bg.wasm
            .local/plugin/embeddinggemma-worker.js
            .local/plugin/pdf-worker.js
            .local/plugin/pdf-ocr-worker.js
            .local/plugin/embeddinggemma-runtime.wasm
            .local/plugin/embeddinggemma-runtime.mjs
            .local/plugin/THIRD_PARTY_NOTICES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            .local/plugin/manifest.json
            .local/plugin/main.js
            .local/plugin/styles.css
            .local/plugin/tern_engine_bg.wasm
            .local/plugin/embeddinggemma-worker.js
            .local/plugin/pdf-worker.js
            .local/plugin/pdf-ocr-worker.js
            .local/plugin/embeddinggemma-runtime.wasm
            .local/plugin/embeddinggemma-runtime.mjs
            .local/plugin/THIRD_PARTY_NOTICES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
