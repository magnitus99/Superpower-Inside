name: Release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: write
  attestations: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify dev-to-main release
        run: |
          git fetch --no-tags origin main dev
          node scripts/check-branch-policy.mjs --release-tag "$GITHUB_REF_NAME"

      - name: Verify committed release assets
        run: node scripts/validate-obsidian-review.mjs --tag "$GITHUB_REF_NAME" --built

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css
            tern_engine_bg.wasm
            embeddinggemma-worker.js
            pdf-worker.js
            pdf-ocr-worker.js
            embeddinggemma-runtime.wasm
            embeddinggemma-runtime.mjs
            THIRD_PARTY_NOTICES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            manifest.json
            main.js
            styles.css
            tern_engine_bg.wasm
            embeddinggemma-worker.js
            pdf-worker.js
            pdf-ocr-worker.js
            embeddinggemma-runtime.wasm
            embeddinggemma-runtime.mjs
            THIRD_PARTY_NOTICES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
