name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify committed release assets
        run: node scripts/validate-obsidian-review.mjs --tag "$GITHUB_REF_NAME" --built

      - name: Verify manifest version matches tag
        run: |
          TAG_VERSION="$GITHUB_REF_NAME"
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          PKG_VERSION=$(jq -r '.version' package.json)
          VERSION_MIN_APP=$(jq -r --arg v "$TAG_VERSION" '.[$v] // empty' versions.json)
          echo "Tag version: $TAG_VERSION"
          echo "Manifest version: $MANIFEST_VERSION"
          echo "Package version: $PKG_VERSION"
          echo "versions.json minAppVersion: $VERSION_MIN_APP"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          if [ -z "$VERSION_MIN_APP" ]; then
            echo "ERROR: versions.json does not contain tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version check passed."

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css
            tern_engine_bg.wasm
            THIRD_PARTY_NOTICES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest.json
            main.js
            styles.css
            tern_engine_bg.wasm
            THIRD_PARTY_NOTICES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
