name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-copy.mjs --release-ref "$GITHUB_SHA" --offline
  publish:
    needs: [quality, copy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify committed release assets
        run: node scripts/validate-obsidian-review.mjs --tag "$GITHUB_REF_NAME" --built

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css
            tern_engine_bg.wasm
            embeddinggemma-worker.js
            embeddinggemma-runtime.wasm
            embeddinggemma-runtime.mjs
            THIRD_PARTY_NOTICES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest.json
            main.js
            styles.css
            tern_engine_bg.wasm
            embeddinggemma-worker.js
            embeddinggemma-runtime.wasm
            embeddinggemma-runtime.mjs
            THIRD_PARTY_NOTICES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
