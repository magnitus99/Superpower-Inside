name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Install Rust security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fish
          cargo install wasm-bindgen-cli --version 0.2.123 --locked
          cargo install cargo-deny --version 0.19.8 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-geiger --version 0.13.0 --locked
          cargo install cargo-vet --version 0.10.2 --locked

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Rust security gate
        run: npm run rust:security

      - name: Obsidian review gate
        run: npm run review -- --tag "$GITHUB_REF_NAME"

      - name: Build
        run: npm run build

      - name: Obsidian review gate for release assets
        run: npm run review -- --tag "$GITHUB_REF_NAME" --built

      - name: Verify manifest version matches tag
        run: |
          TAG_VERSION="$GITHUB_REF_NAME"
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          PKG_VERSION=$(jq -r '.version' package.json)
          VERSION_MIN_APP=$(jq -r --arg v "$TAG_VERSION" '.[$v] // empty' versions.json)
          echo "Tag version: $TAG_VERSION"
          echo "Manifest version: $MANIFEST_VERSION"
          echo "Package version: $PKG_VERSION"
          echo "versions.json minAppVersion: $VERSION_MIN_APP"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          if [ -z "$VERSION_MIN_APP" ]; then
            echo "ERROR: versions.json does not contain tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version check passed."

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest.json
            main.js
            styles.css
          generate_release_notes: true
          fail_on_unmatched_files: true
