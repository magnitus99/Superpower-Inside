name: Patina
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-copy.mjs --range "$COPY_BASE" "$COPY_HEAD" --offline
        env:
          COPY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COPY_HEAD: ${{ github.sha }}
